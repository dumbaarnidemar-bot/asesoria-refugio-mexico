name: "asesoria-refugio-mexico"
title: "Asesoría Refugio México"
description: "Prepara a personas migrantes en México para el procedimiento de reconocimiento de la condición de refugiado ante la COMAR: clasifica la causal del art. 13, ordena el relato y la cronología, prepara la entrevista de elegibilidad, evalúa el caso con los arts. 42 y 43 del Reglamento, y explica plazos, derechos y qué hacer si niegan. Información general, no asesoría jurídica personalizada. Herramienta: Ruta Segura Pro, https://ruta-segura-pro.vercel.app."
category: "Work and knowledge"
include_in_prompt: true
